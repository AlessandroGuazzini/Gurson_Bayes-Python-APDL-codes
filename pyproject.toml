[project]
name = "GursonBayes"
version = "1.0.0"
description = "A multitask Bayesian optimization framework for GTN constitutive model parameters identification."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "T. Grossi", email = "tommaso.grossi@santannapisa.it" },
    { name = "A. Guazzini", email = "alessandro.guazzini@phd.unipi.it" },
]
dependencies = [
    "numpy~=1.26.4",
    "scipy~=1.14.1",
    "scikit-learn~=1.5.2",
    "pandas~=2.2.3",
    "matplotlib~=3.9.2",
    "gpytorch~=1.14",
    "pillow~=10.4.0",
    "pyansys~=2024.2.0",
    "black",
]
